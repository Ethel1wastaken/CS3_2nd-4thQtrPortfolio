<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Q3 2nd Graded Exercise">
    <meta name="keywords" content="HTML Forms">
    <meta name="author" content="Elijah Gamis">
    <title>Sample Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
   <style>
    body{
        padding: 25px;
        font-family: arial;
        width: 80%;
        margin-left: 10%;
        }

        .title {
            color: #5C6AC4;
        }

        fieldset:nth-child(2) {
             margin-top: 20px;
        }

        legend {
            background: black;
            color: yellow;
            padding: 5px;
        }
        label {
             margin: 5%;
        }
    </style>
  </head>
  <body>
     <header>
        <div>
            <img src="../../assets/pshslogo.png" alt="pshs logo" 
               title="The Official Logo" width="50px" height="50px" />
            <h1>
                2NdGraded Exercise   
            </h1>
            <h3>by Elijah Gamis </h3>
        </div>
        <nav class="navbar">
            <a href="../../index.html"> Home </a>
            <a href="registered.html"> Show Saved Accounts </a>
        </nav>
    </header>
    <section>
      <h1 class="title">Sign-up Page</h1>
      <form id="dForm" action="registered.html" method="get">
        <fieldset>
          <legend>Your Credentials</legend><br/>
          <label> Student ID: 
            <input type="number" name="studID" id="studID" required />
          </label><br/><br/>
          <label> Full Name: 
            <input type="text name="studName" id="studName" required />
          </label><br/><br/>
          <label> Date Of Birth :
            <input type="date" name="dob" id="dob" />
          </label><br/><br/>
          <label> Email Address:
            <input type="email" name="email" id="email" required />
          </label><br/><br/>
        </fieldset><fieldset><legend>Additional Information</legend><br/>
          <label> Mobile Phone:
            <input type="text" name="phone" id="phone" />
          </label><br/><br/>
          <label for="grad">Grade Level</label></br>

 <select name="grade" id="grad">

    <option value="7">Grade 7</option>

    <option value="8">Grade 8</option>

    <option value="9">Grade 9</option>
    <option value="10">Grade 10</option>
    <option value="11">Grade 11</option>
    <option value="12">Grade 12</option>

</select>
<br/><br/>
          <label> Intern/Extern : <br/>
            <input type="radio" name="intext" value="extern" /> Extern<br/>
            <input type="radio" name="intext" value="intern" /> Intern
          </label><br/><br/>
          <label for="club">Preferred Organization/Club</label></br>

 <select name="club" id="club">

    <option value="dnd">Intyale</option>

    <option value="sudoku">Sapienara</option>

    <option value="arts">Likha</option>

    <option value="3dprint">Pisay XYZ</option>

    <option value="swim">Flux</option>

</select>
<br/><br/>
          <label> 
            <input type="checkbox" name="dp" id="dp" value="true" /> 
            Agree to Data Privacy Policy
          </label><br/><br/>
          <label> Why do you want to join?<br/>
            <textarea name="about" id="about">
              
            </textarea>
          </label><br/><br/></fieldset>
          
          
        </fieldset>  
        <fieldset>
          <legend>Action Buttons</legend>
          <button type="submit"> Accept </button>
          <input type="reset" value=" Clear " />
        </fieldset> 
      </form>
    </section>
    <script src="q3e3script.js"></script>
  </body>
</html>
